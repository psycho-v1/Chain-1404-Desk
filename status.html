<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPC status · 1404 Desk</title>
  <meta name="description" content="Latency and head height for labelled Chain 1404 RPCs.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("desk-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="status">
  <div id="nav-root"></div>
  <div id="agree-root"></div>
  <main id="page-main" class="container py-4">
<h1 class="h3 mb-3"><i class="fa-solid fa-clock me-2"></i>RPC status</h1>
    <p>Every listed endpoint is queried in parallel. Failures stay visible. Auto-refresh every 60 seconds while this tab stays open.</p>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button class="btn btn-accent" type="button" id="refreshStatus">Refresh now</button>
      <button class="btn btn-ghost" type="button" id="pauseStatus" aria-pressed="false">Pause auto-refresh</button>
      <span id="statusStamp" class="align-self-center small"></span>
    </div>
    <div class="desk-card p-3">
      <div class="table-responsive">
        <table class="table table-desk">
          <thead>
            <tr><th>RPC</th><th>Family</th><th>Latency</th><th>chainId</th><th>blockNumber</th><th>peerCount</th><th>Last error / head</th></tr>
          </thead>
          <tbody id="statusBody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="footer-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/agreements.js"></script>
  <script src="js/rpc.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
