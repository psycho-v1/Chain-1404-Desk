<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspect address · 1404 Desk</title>
  <meta name="description" content="Compare one address on both Chain 1404 histories.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("desk-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="inspect">
  <div id="nav-root"></div>
  <div id="agree-root"></div>
  <main id="page-main" class="container py-4">
<h1 class="h3 mb-3"><i class="fa-solid fa-magnifying-glass me-2"></i>Inspect address</h1>
    <p>Paste a public address. This page only reads. Shareable URL uses <code>?address=0x…</code>.</p>
    <form id="inspectForm" class="desk-card p-3 mb-3">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="address">Address</label>
          <input class="form-control mono" id="address" name="address" required placeholder="0x…" autocomplete="off">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="label">Optional label</label>
          <input class="form-control" id="label" name="label" placeholder="My wallet">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="exchangeUid">Exchange UID</label>
          <input class="form-control" id="exchangeUid" name="exchangeUid">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="depositAddress">Deposit address</label>
          <input class="form-control mono" id="depositAddress" name="depositAddress">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="txHash">Tx hash</label>
          <input class="form-control mono" id="txHash" name="txHash">
        </div>
      </div>
      <div class="d-none d-md-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-accent" type="submit"><i class="fa-solid fa-magnifying-glass me-1"></i>Run live review</button>
        <button class="btn btn-ghost" type="button" id="btnCopyResults"><i class="fa-solid fa-copy me-1"></i>Copy results</button>
        <button class="btn btn-ghost" type="button" id="btnToEvidence"><i class="fa-solid fa-box-archive me-1"></i>Send to Evidence locker</button>
      </div>
    </form>
    <div id="inspectResults"></div>
    <div class="sticky-actions show-mobile">
      <button class="btn btn-accent" type="submit" form="inspectForm">Run</button>
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('btnCopyResults').click()">Copy</button>
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('btnToEvidence').click()">Export</button>
    </div>
  </main>
  <div id="footer-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/agreements.js"></script>
  <script src="js/rpc.js"></script>
  <script src="js/inspect.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
